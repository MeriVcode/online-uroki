ap}header strong{font:700 clamp(22px,2.5vw,34px) Georgia,serif}header small{font-size:15px}.sheet{margin:18px 0;background:#fff8e9f7;border:2px solid #d5b27c;border-radius:14px;box-shadow:0 10px 35px #261b1680;padding:clamp(16px,3vw,36px);min-height:420px}h1,h2{font-family:Georgia,serif;color:#65402b;margin:0 0 10px;line-height:1.15}h1{font-size:clamp(30px,4vw,50px)}h2{font-size:clamp(26px,3vw,38px)}p{margin:8px 0 14px}.eyebrow{font-size:15px;font-weight:bold;color:#745638;text-transform:uppercase;letter-spacing:.07em}.instruction{color:#4b3b2e}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:#fffdf7;border:1px solid #ddc8a4;border-radius:10px;padding:12px 15px}.card b{display:block;margin-bottom:6px}.letters,.choices,.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}button{font:inherit;cursor:pointer;border:1px solid #bfa17a;background:#fffdf7;color:#493523;border-radius:8px;padding:9px 14px;min-height:44px}button:hover:not(:disabled){background:#f6e6c6}button:focus-visible{outline:3px solid #2574a0;outline-offset:2px}button:disabled{cursor:default;opacity:.48}.primary{background:#375b43;color:white;border-color:#375b43;font-weight:bold}.primary:hover:not(:disabled){background:#294734}.letter{font-weight:bold;min-width:44px;padding:7px 10px}.word{min-height:44px;margin:8px 0;border-bottom:2px solid #a78761;font-size:1.3em;font-weight:bold;letter-spacing:.12em}.selected{background:#e2edd9;border:2px solid #58744d;color:#25482d}.ok{color:#285e3c}.bad{color:#9b3529}.msg{min-height:1.5em;font-size:.83em;font-weight:bold;margin-top:5px}.nav{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.sample{font:700 clamp(24px,3vw,36px)/1.35 Georgia,serif;background:#f6e8ca;border-left:5px solid #58744d;padding:16px;border-radius:5px}.q{font-size:1.12em;font-weight:bold;margin:16px 0 6px}.small{font-size:.85em;color:#6a5140}footer{color:#fff9e8;background:#35251de8;padding:7px 15px;border-radius:8px;font-size:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}input[type=checkbox]{width:22px;height:22px;accent-color:#375b43;vertical-align:middle}label.check{display:block;margin:12px 0}select{font:inherit;padding:8px;max-width:100%;border:1px solid #bfa17a;background:#fffdf7;border-radius:8px}#screen:focus{outline:none}@media(max-width:700px){#app{padding:10px}.grid{grid-template-columns:1fr}.sheet{margin:10px 0;padding:15px}.letter{min-width:38px}.nav button{font-size:16px}header{padding:8px 12px}}
</style></head><body><div id="app"><header><strong>Мастерская слов</strong><small>Русский язык · 3 класс · 5–7 минут</small></header><main class="sheet" id="screen" tabindex="-1"></main><div class="nav" id="nav"></div><footer><span>М. Братухина</span><span>Слово → словосочетание → предложение → тетрадь</span></footer></div><script>
const words=[{letters:'ЗОМРО',answer:'МОРОЗ'},{letters:'РЬФАНО',answer:'ФОНАРЬ'},{letters:'ЕГСН',answer:'СНЕГ'},{letters:'РОЗУ',answer:'УЗОР'}];
const traits=[{word:'Мороз',options:['трескучий','мокрый','сильный','деревянный','лёгкий'],valid:['трескучий','сильный','лёгкий']},{word:'Фонарь',options:['уличный','солёный','старинный','яркий','пушистый'],valid:['уличный','старинный','яркий']},{word:'Снег',options:['искристый','громкий','рыхлый','пушистый','стеклянный'],valid:['искристый','рыхлый','пушистый']},{word:'Узор',options:['морозный','причудливый','варёный','красивый','мокрый'],valid:['морозный','причудливый','красивый']}];
const steps=[{q:'Какой снег?',opts:['пушистый','лёгкий','мелкий'],def:'пушистый'},{q:'Как кружился?',opts:['медленно','легко','бесшумно'],def:'медленно'},{q:'Где кружился?',opts:['над городом','над двором','в воздухе'],def:'над городом'},{q:'Когда кружился?',opts:['вечером','утром','в сумерках'],def:'вечером'}];
let stage=0, picks=words.map(()=>[]), wdone=words.map(()=>false), ts=traits.map(()=>[]), tdone=traits.map(()=>false), growth=[], checks=[false,false,false,false];
const $=x=>document.getElementById(x);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function sentence(){return cap([growth[3],growth[0],'снег',growth[1],'кружился',growth[2]].filter(Boolean).join(' '))+'.'}
function change(n){stage=n;render();$('screen').focus();window.scrollTo(0,0)}
function render(){let h='';if(stage===0){h='<div class="eyebrow">Речевая разминка</div><h1>От слова к предложению</h1><p>Сегодня в мастерской из букв рождаются слова, а из слов — выразительные предложения.</p><p><b>Работайте вместе:</b> каждый выполняет задания на своём экране. Обсуждайте ответы вслух, слушайте и дополняйте друг друга.</p><p>В конце запиши своё предложение в тетрадь.</p><button class="primary" onclick="change(1)">Начать работу</button>'}
if(stage===1){h='<div class="eyebrow">1 из 4 · 1 минута</div><h2>Рассыпанные слова</h2><p>Нажимай на буквы по порядку, чтобы собрать слово. Назовите собранные слова вслух.</p><div class="grid">'+words.map((w,i)=>`<div class="card"><div class="letters">${[...w.letters].map((l,j)=>`<button class="letter" aria-label="Буква ${l}, ${j+1}" ${picks[i].includes(j)||wdone[i]?'disabled':''} onclick="addLetter(${i},${j})">${l}</button>`).join('')}</div><div class="word" aria-live="polite">${picks[i].map(j=>w.letters[j]).join('')||'&nbsp;'}</div><div class="controls"><button onclick="undo(${i})" ${!picks[i].length||wdone[i]?'disabled':''}>Убрать букву</button><button onclick="checkWord(${i})" ${picks[i].length!==w.letters.length||wdone[i]?'disabled':''}>Проверить</button></div><div class="msg ${wdone[i]?'ok':''}" id="wm${i}">${wdone[i]?'Слово собрано!':''}</div></div>`).join('')+'</div>'}
if(stage===2){h='<div class="eyebrow">2 из 4 · 1–2 минуты</div><h2>Найди точное слово</h2><p>Выбери два подходящих признака для каждого слова. Прочитайте словосочетания и придумайте вместе ещё один признак, которого нет в списке.</p><div class="grid">'+traits.map((t,i)=>`<div class="card"><b>${t.word} — какой?</b><div class="choices">${t.options.map(o=>`<button class="${ts[i].includes(o)?'selected':''}" aria-pressed="${ts[i].includes(o)}" onclick="toggleTrait(${i},'${o}')">${o}</button>`).join('')}</div><div class="controls" style="margin-top:8px"><button onclick="checkTrait(${i})" ${ts[i].length!==2?'disabled':''}>Проверить</button><span class="msg ${tdone[i]?'ok':''}" id="tm${i}">${tdone[i]?'Подходит!':''}</span></div></div>`).join('')+'</div>'}
if(stage===3){let k=growth.length;h=`<div class="eyebrow">3 из 4 · 2 минуты</div><h2>Выращиваем предложение</h2><p>Обсудите вопрос вслух. Выберите слово или предложите своё. После каждого шага произнесите всё предложение целиком.</p><div class="sample" aria-live="polite">${esc(sentence())}</div>`;if(k<4){h+=`<div class="q">${steps[k].q}</div><div class="choices">${steps[k].opts.map(o=>`<button onclick="grow('${o}')">${o}</button>`).join('')}</div><p class="small">Можно выбрать другой подходящий вариант устно. Учитель поможет проверить его.</p><label class="small" for="own">Свой вариант (необязательно)</label><div class="controls"><input id="own" maxlength="55" style="font:inherit;max-width:100%;width:270px;padding:9px;border:1px solid #bfa17a;border-radius:8px" placeholder="Слово или сочетание"><button onclick="ownGrow()">Добавить</button></div>`}else{h+='<p class="ok"><b>Предложение выросло!</b> Прочитайте его выразительно. Какие подробности мы добавили?</p>'}if(k)h+='<button onclick="growth.pop();render()">Изменить последний ответ</button>'}
if(stage===4){h='<div class="eyebrow">4 из 4 · 2 минуты</div><h2>Мастерская авторов</h2><div class="sample">Фонарь светил.</div><p>Каждый самостоятельно распространи предложение. Используй вопросы:</p><div class="choices"><b>Какой?</b> · <b>Где?</b> · <b>Когда?</b> · <b>Как?</b></div><p>Прочитайте свои варианты друг другу. Обсудите, какие подробности делают предложение точнее и выразительнее.</p><p><b>Запиши своё предложение в тетрадь.</b></p><div class="card"><b>Проверь себя</b>'+['Предложение начинается с большой буквы.','Слова связаны по смыслу.','Я добавил важные подробности.','В конце предложения стоит точка.'].map((t,i)=>`<label class="check"><input type="checkbox" ${checks[i]?'checked':''} onchange="checks[${i}]=this.checked;updateNav()"> ${t}</label>`).join('')+'</div>'}
if(stage===5){h='<div class="eyebrow">Работа завершена</div><h2>Мастерская закрывается</h2><p>Сегодня ты составлял слова, подбирал признаки и распространял предложения.</p><p class="sample">Слово → словосочетание → предложение</p><p>Покажи своё записанное предложение учителю. Теперь можно закрыть игру и перейти к основному заданию урока.</p><button onclick="resetAll()">Начать заново</button>'}$('screen').innerHTML=h;updateNav()}
function updateNav(){let next=stage===1?wdone.every(Boolean):stage===2?tdone.every(Boolean):stage===3?growth.length===4:stage===4?checks.every(Boolean):true;$('nav').innerHTML=stage>0&&stage<5?`<button onclick="change(${stage-1})">Назад</button><button class="primary" ${next?'':'disabled'} onclick="change(${stage+1})">${stage===4?'Завершить':'Далее'}</button>`:'';$('nav').style.marginBottom=stage>0&&stage<5?'14px':'0'}
function addLetter(i,j){if(!picks[i].includes(j)&&!wdone[i])picks[i].push(j);render()}function undo(i){picks[i].pop();render()}function checkWord(i){if(picks[i].map(j=>words[i].letters[j]).join('')===words[i].answer){wdone[i]=true;render()}else{$('wm'+i).textContent='Проверь порядок букв.';$('wm'+i).className='msg bad'}}
function toggleTrait(i,o){let a=ts[i];if(a.includes(o))a.splice(a.indexOf(o),1);else if(a.length<2)a.push(o);else{ $('tm'+i).textContent='Сначала сними один выбор.';return}tdone[i]=false;render()}function checkTrait(i){if(ts[i].length===2&&ts[i].every(o=>traits[i].valid.includes(o))){tdone[i]=true;render()}else{$('tm'+i).textContent='Один или оба признака не подходят.';$('tm'+i).className='msg bad'}}
function grow(o){if(growth.length<4){growth.push(o);render()}}function ownGrow(){let v=$('own').value.trim().toLowerCase().replace(/[.!?]+$/,'');if(v)grow(v);else $('own').focus()}function resetAll(){picks=words.map(()=>[]);wdone=words.map(()=>false);ts=traits.map(()=>[]);tdone=traits.map(()=>false);growth=[];checks=[false,false,false,false];change(0)}render();
</script></body></html>
