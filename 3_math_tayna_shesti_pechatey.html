function stageArt(index){return `<img class="art" src="${illustrations[index]}" alt="${stages[index].title}">`;}
function renderExpression(expr, itemIndex){
  let opCount=0;
  const cells=expr.tokens.map((token)=>{
    if(token.k==='op'){
      const idx=opCount++;
      return `<div class="expr-cell op"><input inputmode="numeric" maxlength="2" value="${get(`arith_${itemIndex}_order_${idx}`)}" oninput="put('arith_${itemIndex}_order_${idx}',this.value)"><div class="token">${token.t}</div></div>`;
    }
    return `<div class="expr-cell ${token.k}"><div class="token">${token.t}</div></div>`;
  }).join('');
  const stepBoxes=Array.from({length:expr.steps},(_,n)=>`<div class="step-box"><label>Промежуточный ответ ${n+1}</label><input value="${get(`arith_${itemIndex}_step_${n}`)}" oninput="put('arith_${itemIndex}_step_${n}',this.value)"></div>`).join('');
  return `<article class="card"><h3>${expr.title}</h3><div class="order-wrap"><div class="expr-title">Расставь порядок действий в кружках.</div><div class="expr-grid">${cells}</div></div><div class="steps-grid">${stepBoxes}</div><div class="answer-row"><div><label>Окончательный ответ</label><input class="short" inputmode="numeric" value="${get(`arith_${itemIndex}_final`)}" oninput="put('arith_${itemIndex}_final',this.value)"></div></div></article>`;
}
function renderStart(){
  app.innerHTML=`<section>${stageArt(0)}<h1>Тайна шести печатей</h1><p>В долине знаний закрылись шесть мастерских. В каждой хранится печать. Чтобы открыть их, ребёнок выполняет задания как в тетради: считает, рассуждает, объясняет, решает задачи и чертит.</p><div class="list-hint"><b>Что важно:</b> Записывай свои решения. После квеста получишь грамоту и сможешь скачать выполненную работу.</div><label>Имя ученика</label><input id="name" value="${esc(state.name)}" placeholder="Введи имя" oninput="state.name=this.value;save()"><button onclick="if(state.name.trim())go(0);else document.getElementById('name').focus()">Начать квест</button></section>`;
}
function symbolBar(id,key){return `<div class="symbols" aria-label="Математические знаки">${['?','→','←','↑','↓','↔','{','}','[',']','(',')','×',':','+','−','=','|','—','↵'].map(t=>`<button type="button" onpointerdown="event.preventDefault()" onclick="insertSymbol('${id}','${key}',this.textContent)">${t}</button>`).join('')}</div>`;}
function insertSymbol(id,key,t){const el=document.getElementById(id);const a=el.selectionStart,b=el.selectionEnd;el.setRangeText(t==='↵'?'\n':t,a,b,'end');put(key,el.value);el.focus();}
function equationFields(i,j){const k=`${i}_${j}`;return `<label>Запиши решение уравнения.</label><div class="eqrow"><span>a =</span><input aria-label="Первое число" inputmode="numeric" value="${get(k+'left')}" oninput="put('${k}left',this.value)"><select aria-label="Выбери действие" onchange="put('${k}op',this.value)"><option value="">?</option>${['+','−','×',':'].map(op=>`<option ${state.answers[k+'op']===op?'selected':''}>${op}</option>`).join('')}</select><input aria-label="Второе число" inputmode="numeric" value="${get(k+'right')}" oninput="put('${k}right',this.value)"></div>`;}
function renderStandardStage(i,stage){
 app.innerHTML=nav()+`<section>${stageArt(i)}<small>Испытание ${i+1} из 6</small><h1>${stage.title}</h1><p>${stage.subtitle}</p>${stage.tasks.map((task,j)=>{const k=`${i}_${j}`,problem=i===3||i===4,eq=i===2&&j>0;return `<article class="card"><h3>Задание ${j+1}</h3><div class="prompt">${task.q}</div>${problem?`<label for="schema${j}">Краткая запись или схема</label>${symbolBar('schema'+j,k+'schema')}<textarea class="schema" id="schema${j}" oninput="put('${k}schema',this.value)" placeholder="Запиши краткое условие…">${get(k+'schema')}</textarea><label for="work${j}">Решение по действиям с пояснениями</label>${symbolBar('work'+j,k+'w')}<textarea id="work${j}" oninput="put('${k}w',this.value)">${get(k+'w')}</textarea>`:eq?equationFields(i,j):`<label>${task.how}</label><textarea oninput="put('${k}w',this.value)" placeholder="Запиши решение...">${get(k+'w')}</textarea>`}<label>${task.answerLabel}</label><input class="short" inputmode="numeric" value="${get(k+'a')}" oninput="put('${k}a',this.value)"><label>${task.reason}</label><textarea oninput="put('${k}r',this.value)" placeholder="${eq?'Запиши проверку…':'Объясни своими словами…'}">${get(k+'r')}</textarea></article>`}).join('')}<p class="notice" id="msg"></p><button class="secondary" onclick="go(${i-1})">Назад</button><button onclick="complete(${i})">Сдать испытание</button></section>`;
}
function renderArithmeticStage(i){
  app.innerHTML=nav()+`<section>${stageArt(i)}<small>Испытание ${i+1} из 6</small><h1>${stages[i].title}</h1><p>${stages[i].subtitle}</p>${arithmetic.map((expr,idx)=>renderExpression(expr,idx)).join('')}<p class="notice" id="msg"></p><button class="secondary" onclick="go(${i-1})">Назад</button><button onclick="complete(${i})">Сдать испытание</button></section>`;
}
function renderGeometryStage(i){
  app.innerHTML=nav()+`<section>${stageArt(i)}<small>Испытание ${i+1} из 6</small><h1>${stages[i].title}</h1><p>${stages[i].subtitle}</p><article class="card"><h3>Задание</h3><div class="prompt">Найди периметр прямоугольника, если его длина 9 см, это в 3 раза больше, чем ширина. Найди площадь. Начерти этот прямоугольник.</div><label>Как найти ширину? Запиши вычисление.</label><textarea oninput="put('geo_work',this.value)" placeholder="Запиши ход решения...">${get('geo_work')}</textarea><label>Вычисление периметра</label><textarea oninput="put('geo_pwork',this.value)">${get('geo_pwork')}</textarea><label>Вычисление площади</label><textarea oninput="put('geo_awork',this.value)">${get('geo_awork')}</textarea><div class="answer-row"><div><label>Ширина (см)</label><input class="short" inputmode="numeric" value="${get('geo_width')}" oninput="put('geo_width',this.value)"></div><div><label>Периметр (см)</label><input class="short" inputmode="numeric" value="${get('geo_perim')}" oninput="put('geo_perim',this.value)"></div><div><label>Площадь (кв. см)</label><input class="short" inputmode="numeric" value="${get('geo_area')}" oninput="put('geo_area',this.value)"></div></div></article><h2>Чертёж</h2><p>Одна клетка — 1 см по условному масштабу. Зажми левую кнопку мыши и проведи карандашом сторону по клеткам. Отпусти кнопку и начерти следующую сторону.</p><p><b>Карандаш</b> — проведи линию по клеткам.</p><canvas class="grid" id="grid" width="720" height="360"></canvas><button class="secondary" onclick="undoLine()">Отменить сторону</button><button class="secondary" onclick="clearLines()">Очистить чертёж</button><p class="notice" id="msg"></p><button class="secondary" onclick="go(${i-1})">Назад</button><button onclick="complete(${i})">Сдать испытание</button></section>`;
  initGrid();
}
function render(){
  document.getElementById('status').textContent=`Печати: ${state.done.length} из 6`;
  if(state.page===-1){renderStart();return;}
  if(state.page===6){finish();return;}
  const stage=stages[state.page];
  if(stage.type==='arithmetic') return renderArithmeticStage(state.page);
  if(stage.type==='geometry') return renderGeometryStage(state.page);
  return renderStandardStage(state.page,stage);
}
function complete(i){
  let ok=true, msg='';
  if(i===0){
    arithmetic.forEach((expr,idx)=>{
      for(let a=0;a<expr.tokens.filter(t=>t.k==='op').length;a++){ if(!String(state.answers[`arith_${idx}_order_${a}`]||'').trim()) ok=false; }
      for(let s=0;s<expr.steps;s++){ if(!String(state.answers[`arith_${idx}_step_${s}`]||'').trim()) ok=false; }
      if(!String(state.answers[`arith_${idx}_final`]||'').trim()) ok=false;
    });
    msg='Заполни кружки порядка действий, промежуточные ответы и окончательные ответы.';
  } else if(i===5){
    const needed=['geo_work','geo_pwork','geo_awork','geo_width','geo_perim','geo_area'];
    ok=needed.every(k=>String(state.answers[k]||'').trim()) && state.lines.length>0;
    msg='Заполни ход решения, ширину, периметр, площадь и выполни чертёж.';
  } else {
    const tasks=stages[i].tasks;
    ok=tasks.every((t,j)=>(i===2&&j>0?['left','op','right','r','a']:i===3||i===4?['schema','w','r','a']:['w','r','a']).every(s=>String(state.answers[`${i}_${j}_${s}`]||'').trim()));
    msg='Заполни решение, объяснение и ответ во всех заданиях этого испытания.';
  }
  document.getElementById('msg').textContent=ok?'':msg;
  if(!ok) return;
  if(!state.done.includes(i)) state.done.push(i);
  save();
  if(state.done.length===6) go(6);
  else {
    const next=[0,1,2,3,4,5].find(n=>n>i && !state.done.includes(n)) ?? [0,1,2,3,4,5].find(n=>!state.done.includes(n));
    go(next);
  }
}
let point=null,preview=null;
function initGrid(){point=null;preview=null;draw();const c=document.getElementById('grid');const pos=e=>{const r=c.getBoundingClientRect();return [Math.max(0,Math.min(24,Math.round((e.clientX-r.left)*24/r.width))),Math.max(0,Math.min(12,Math.round((e.clientY-r.top)*12/r.height)))];};c.onpointerdown=e=>{if(e.button!==0)return;e.preventDefault();point=pos(e);preview=point;c.setPointerCapture(e.pointerId);draw();};c.onpointermove=e=>{if(point){preview=pos(e);draw();}};c.onpointerup=e=>{if(!point)return;const p=pos(e);if(point[0]!==p[0]||point[1]!==p[1])state.lines.push([point,p]);point=null;preview=null;save();draw();};c.onpointercancel=()=>{point=null;preview=null;draw();};}
function draw(){const c=document.getElementById('grid');if(!c)return;const x=c.getContext('2d');x.clearRect(0,0,720,360);x.strokeStyle='#d0dfdd';x.lineWidth=1;for(let i=0;i<=720;i+=30){x.beginPath();x.moveTo(i,0);x.lineTo(i,360);x.stroke();}for(let i=0;i<=360;i+=30){x.beginPath();x.moveTo(0,i);x.lineTo(720,i);x.stroke();}x.strokeStyle='#315f5c';x.lineWidth=4;function line(a,b){x.beginPath();x.moveTo(a[0]*30,a[1]*30);x.lineTo(b[0]*30,b[1]*30);x.stroke();}state.lines.forEach(([a,b])=>line(a,b));if(point&&preview){x.strokeStyle='#b77a33';line(point,preview);}}
function undoLine(){state.lines.pop();point=null;save();draw();}
function clearLines(){state.lines=[];point=null;save();draw();}
function finish(){
  app.innerHTML=`<div class="no-print">${nav()}<p>Все шесть испытаний пройдены. Теперь можно распечатать грамоту и скачать свою работу для учителя.</p></div><section class="cert"><h1>ГРАМОТА</h1><p>награждается</p><h2>${esc(state.name)}</h2><p>за успешное прохождение математического квеста<br>«Тайна шести печатей»</p><p>За старание, внимательность, умение рассуждать и записывать решение как в тетради.</p><p>Пройдено испытаний: 6 из 6</p></section><button onclick="window.print()">Распечатать грамоту / PDF</button><button onclick="report()">Скачать свою работу</button><button class="secondary" onclick="go(0)">Вернуться к заданиям</button>`;
}
function report(){
 const arithmeticReport=arithmetic.map((expr,idx)=>{
 const order=expr.tokens.map(t=>t.t).join(' ');
 const nums=expr.tokens.filter(t=>t.k==='op').map((t,n)=>`${t.t}: ${esc(state.answers[`arith_${idx}_order_${n}`]||'—')}`).join(' · ');
 const steps=Array.from({length:expr.steps},(_,n)=>`${n+1}) ${esc(state.answers[`arith_${idx}_step_${n}`]||'—')}`).join('<br>');
 return `<div class="card"><b>${order}</b><p>Порядок действий (слева направо): ${nums}</p><p>Вычисления:<br>${steps}</p><p>Ответ: ${get(`arith_${idx}_final`)||'—'}</p></div>`;
 }).join('');
 const others=stages.map((s,i)=>s.type!=='standard'?'':`<h2>${i+1}. ${s.title}</h2>`+s.tasks.map((t,j)=>`<div class="card"><b>${esc(t.q)}</b>${i===3||i===4?`<p>Краткая запись:</p><pre>${get(`${i}_${j}_schema`)||'—'}</pre>`:''}<p>Решение:</p><pre>${i===2&&j>0?`a = ${get(`${i}_${j}_left`)} ${get(`${i}_${j}_op`)} ${get(`${i}_${j}_right`)}`:get(`${i}_${j}_w`)||'—'}</pre><p>Объяснение:</p><pre>${get(`${i}_${j}_r`)||'—'}</pre><p>Ответ: ${get(`${i}_${j}_a`)||'—'}</p></div>`).join('')).join('');
 app.innerHTML=`<section><h1>Выполненная работа</h1><p>Ученик: ${esc(state.name)}. Пройдено испытаний: ${state.done.length}/6.</p><button onclick="render()">Вернуться к квесту</button><button onclick="downloadReport()">Скачать работу HTML</button><button onclick="window.print()">Печать / PDF</button><h2>1. Архив шифров</h2>${arithmeticReport}${others}<h2>6. Чертёжная башня</h2><div class="card"><p>Решение:</p><pre>${get('geo_work')||'—'}</pre><p>Ширина: ${get('geo_width')||'—'} см</p><p>Вычисление периметра: ${get('geo_pwork')||'—'}</p><p>Вычисление площади: ${get('geo_awork')||'—'}</p><p>Периметр: ${get('geo_perim')||'—'} см</p><p>Площадь: ${get('geo_area')||'—'} кв. см</p></div><canvas class="grid" id="grid" width="720" height="360"></canvas></section>`;point=null;draw();
}
function downloadReport(){
  const liveCanvas=document.getElementById('grid');
  const clone=app.cloneNode(true);
  clone.querySelectorAll('button,.no-print').forEach(n=>n.remove());
  const canvas=clone.querySelector('canvas');
  if(canvas && liveCanvas){ const img=document.createElement('img'); img.src=liveCanvas.toDataURL(); img.style.maxWidth='100%'; canvas.replaceWith(img); }
  const html='<!doctype html><html lang="ru"><meta charset="utf-8"><title>Отчёт</title><style>body{font:20px/1.55 Georgia,serif;max-width:980px;margin:30px auto;padding:15px;background:#fffdf8;color:#24383a}.card{border:1px solid #cbbd9d;border-radius:12px;padding:14px;margin:12px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}</style>'+clone.innerHTML+'</html>';
  const blob=new Blob([html],{type:'text/html;charset=utf-8'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='Моя_работа_Тайна_шести_печатей.html'; a.click(); setTimeout(()=>URL.revokeObjectURL(url),1000);
}
render();
</script>
</body>
</html>
