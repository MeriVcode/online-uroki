.report{background:#fffcf4;border:2px solid #dfc8a0;border-radius:19px;padding:22px;margin-top:17px;box-shadow:0 7px 20px #2b493a13}.report h2{font:700 27px Georgia,serif;margin:0 0 6px;color:#164c5c}.report h3{margin:19px 0 7px;font-size:17px}.report-intro{margin:0 0 10px;color:#557076}.report-stats{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:10px;margin:16px 0}.report-stat{background:#eef8f3;border:1px solid #c7e4da;border-radius:13px;padding:15px 9px;text-align:center}.report-stat strong{display:block;font:700 31px Georgia,serif;color:#165f69}.report-stat span{font-size:12px;color:#476e70}.report-table{width:100%;border-collapse:collapse;font-size:13px}.report-table th,.report-table td{padding:10px;border-bottom:1px solid #dcded3;text-align:left}.report-table th{background:#e9f3f0;color:#285b64}.report-table td:not(:first-child){text-align:center;font-variant-numeric:tabular-nums}.report-table tfoot td{font-weight:bold}.report-scroll{overflow:auto}.report-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:17px}.report-footnote{color:#52666a;font-size:12px;line-height:1.55}.report-status{font-size:12px;color:#637271}.report-status.recovered{color:#16775e;font-weight:750}

<body>
<header><div class="header-inner">
  <div class="brand"><div class="brand-mark">✦</div><div><small>Математика · 3 класс · 45 минут</small><strong>За кристаллами знаний</strong></div></div>
  <div class="gems" id="topGems" aria-label="Собранные кристаллы"></div><div class="stats-head" id="statsHead" aria-live="off"></div>
  <div class="top-actions">
    <div class="clock" id="clock" title="Таймер занятия. Не меняет экраны автоматически"><small>Осталось</small><strong id="clockText">45:00</strong></div>
    <button class="btn-mini" id="timerButton" data-act="timer">Старт таймера</button>
    <button class="btn-mini" data-go="report">Мой отчёт</button>
    <button class="btn-mini" data-act="sound" id="soundButton" title="Включить или выключить звуки наград">Звук: выкл.</button>
    <button class="btn-mini" data-act="fullscreen">⛶ Экран</button>
    <button class="btn-mini" data-act="reset" title="Начать заново">↺</button>
  </div>
</div></header>
<main class="screen" id="app"></main>

<script>
'use strict';
const LEVELS=[
  {name:'Врата Таблицы',title:'Локация 1. Врата Таблицы',minutes:7,kind:'gate',art:'art-gate',goal:'Расшифруем код старинных ворот. Каждый верный ответ открывает свою пронумерованную печать.'},
  {name:'Пещера Неизвестных',title:'Локация 2. Пещера Неизвестных',minutes:7,kind:'cave',art:'art-cave',goal:'Восстановим три древние записи. Сначала решаем в тетради, затем объясняем правило.'},
  {name:'Мост Порядка',title:'Локация 3. Мост Порядка',minutes:7,kind:'bridge',art:'art-bridge',goal:'Пройдём по хрупким плитам, соблюдая порядок действий.'},
  {name:'Лабиринт Задач',title:'Локация 4. Лабиринт Задач',minutes:9,kind:'maze',art:'art-maze',goal:'Выберемся из лабиринта за три действия. Важен не только ответ, но и объяснение каждого шага.'},
  {name:'Храм Геометрии',title:'Локация 5. Храм Геометрии',minutes:7,kind:'temple',art:'art-temple',goal:'Составим чертёж посадочной площадки и вычислим периметр и площадь.'},
];
const initial=()=>({role:2,coreCleared:[false,false,false,false,false],roleSolved:[false,false,false,false,false],debriefShown:[false,false,false,false,false],screen:'map',completed:[false,false,false,false,false],gate:[false,false,false,false,false,false],cave:[false,false,false],bridge:[false,false,false],maze:[false,false,false],temple:false,pauseIndex:0,pauseRevealed:false,showScheme:false,showVertices:false,rating:null,sound:false,remaining:2700,studentName:"",diagnostics:{tasks:{}}});
let S=initial();let timerRunning=false,timerId=null;let lastTick=Date.now();let soundCtx=null;let diagnosticInterval=null;
try{const saved=JSON.parse(localStorage.getItem('crystalmath_pupil_issledovatel_v2')||'null');if(saved&&Array.isArray(saved.completed)&&saved.completed.length===5){S={...initial(),...saved};if(typeof S.screen!=='string')S.screen='map';if(!S.diagnostics||typeof S.diagnostics!=='object'||!S.diagnostics.tasks)S.diagnostics={tasks:{}};if(typeof S.studentName!=='string')S.studentName='';for(const rec of Object.values(S.diagnostics.tasks)){if(rec.runningSince){rec.runningSince=null}}}}catch(e){}
S.role=2;
function store(){try{localStorage.setItem('crystalmath_pupil_issledovatel_v2',JSON.stringify(S))}catch(e){}}
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function playSound(success=false){if(!S.sound)return;try{soundCtx=soundCtx||new (window.AudioContext||window.webkitAudioContext)();soundCtx.resume();const notes=success?[523,659,784,1047]:[587,784];notes.forEach((f,i)=>{let o=soundCtx.createOscillator(),g=soundCtx.createGain(),t=soundCtx.currentTime+i*.12;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.08,t+.025);g.gain.exponentialRampToValueAtTime(.001,t+.24);o.connect(g);g.connect(soundCtx.destination);o.start(t);o.stop(t+.26)});}catch(e){}}
function lock(done){return done?'<svg class="lock-svg" viewBox="0 0 20 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 10V6a6 6 0 0 1 11-3"/><rect x="2" y="10" width="16" height="12" rx="2" fill="#3db79b" stroke="#177c67"/><circle cx="10" cy="16" r="1.2" fill="white"/></svg>':'<svg class="lock-svg" viewBox="0 0 20 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 10V7a6 6 0 0 1 12 0v3"/><rect x="2" y="10" width="16" height="12" rx="2" fill="#ab8147" stroke="#694524"/><circle cx="10" cy="16" r="1.2" fill="white"/></svg>'}
function gems(big=false){return Array.from({length:5},(_,i)=>`<span class="gem-wrap ${S.completed[i]?'lit':''}" data-num="${i+1}" title="Кристалл ${i+1}: ${S.completed[i]?'получен':'ещё не получен'}"><span class="gem"></span></span>`).join('')+(big?'':`<span class="progress-label">${S.completed.filter(Boolean).length}/5</span>`)}
function secTime(sec){sec=Math.max(0,Math.floor(sec));return `${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
function diagnosticEntries(){return Object.entries(S.diagnostics?.tasks||{}).map(([key,t])=>({key,...t}));}
function diagSummary(){const entries=diagnosticEntries();return {errors:entries.reduce((x,t)=>x+(t.errors||0),0),changes:entries.reduce((x,t)=>x+(t.changes||0),0),corrected:entries.filter(t=>t.corrected).length,needsWork:entries.filter(t=>!t.solved&&t.errors>0).length,seconds:entries.reduce((x,t)=>x+correctTime(t),0)}}
function correctTime(t){return Math.round((t.correctionMs||0)/1000)+((t.wrongSince!==null&&t.wrongSince!==undefined&&t.runningSince)?Math.max(0,Math.floor((Date.now()-t.runningSince)/1000)):0)}
function pauseCorrectionClocks(){let changed=false;for(const t of Object.values(S.diagnostics.tasks)){if(t.runningSince){t.correctionMs=(t.correctionMs||0)+Math.max(0,Date.now()-t.runningSince);t.runningSince=null;changed=true}}if(changed)store()}
function resumeCorrectionClocks(){let changed=false;for(const t of Object.values(S.diagnostics.tasks)){if(t.wrongSince!==null&&t.wrongSince!==undefined&&!t.solved&&!t.runningSince){t.runningSince=Date.now();changed=true}}if(changed)store();refreshDiagCounters()}
// Ошибка — только неверная проверка заполненного задания. Изменение — новый вариант отправленного ответа.
function recordAttempt(key,label,level,value,correct){const items=S.diagnostics.tasks;let t=items[key];if(!t)t=items[key]={label,level,attempts:0,errors:0,changes:0,corrected:false,solved:false,lastSubmission:null,wrongSince:null,runningSince:null,correctionMs:0};if(t.solved)return;
 const normalized=String(value);if(t.lastSubmission!==null&&t.lastSubmission!==normalized)t.changes++;
 t.attempts++;t.lastSubmission=normalized;
 if(!correct){t.errors++;if(t.wrongSince===null){t.wrongSince=Date.now();t.runningSince=Date.now()}else if(!t.runningSince)t.runningSince=Date.now()}
 else{t.solved=true;if(t.wrongSince!==null){t.corrected=true;if(t.runningSince)t.correctionMs+=Math.max(0,Date.now()-t.runningSince);t.runningSince=null}}
 store();refreshDiagCounters();}
function markAttempt(type,id,value,correct){const i=Number(id),key=(type==='crew'?`crew:${i}:role:${S.role}`:`${type}:${i}`);
 const label=type==='gate'?`Печать ${i+1}: ${gates[i][0]}`:type==='cave'?`Уравнение ${i+1}: ${caveData[i].eq}`:type==='bridge'?`Выражение ${i+1}: ${bridgeData[i].eq}`:type==='maze'?`Шаг задачи ${i+1}`:type==='temple'?'Периметр и площадь':`Поручение «${ROLES[S.role].name}»`;
 const level=type==='crew'?i:type==='gate'?0:type==='cave'?1:type==='bridge'?2:type==='maze'?3:4;
 recordAttempt(key,label,level,value,correct);}
function correctingBadge(key){const t=S.diagnostics.tasks[key];if(!t||t.solved||t.wrongSince===null)return '';return `<div class="correction-alert active" role="status">⏱ Исправляю ошибку · <span class="elapsed" data-correction="${key}">${secTime(correctTime(t))}</span><span data-error-count="${key}">Неверных проверок: ${t.errors}. Попробуй другой ответ!</span></div>`}
function refreshDiagCounters(){const total=diagSummary();const a=document.getElementById('statsHead');if(a)a.innerHTML=`<span class="stats-chip">Ошибок <b>${total.errors}</b></span><span class="stats-chip">Исправлено <b>${total.corrected}</b></span>${total.needsWork?`<span class="stats-chip in-progress">⏱ Исправляю <b>${total.needsWork}</b></span>`:''}`;document.querySelectorAll('[data-correction]').forEach(el=>{const t=S.diagnostics.tasks[el.dataset.correction];if(t&&!t.solved)el.textContent=secTime(correctTime(t))});document.querySelectorAll('[data-error-count]').forEach(el=>{const t=S.diagnostics.tasks[el.dataset.errorCount];if(t)el.textContent=`Неверных проверок: ${t.errors}. Попробуй другой ответ!`})}
function updateHeader(){document.getElementById('topGems').innerHTML=gems();document.getElementById('soundButton').textContent='Звук: '+(S.sound?'вкл.':'выкл.');const m=Math.floor(S.remaining/60),s=S.remaining%60;document.getElementById('clockText').textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;document.getElementById('clock').classList.toggle('warning',S.remaining<300);document.getElementById('timerButton').textContent=timerRunning?'Пауза':'Старт таймера';refreshDiagCounters()}
function startTimer(){if(timerRunning){timerRunning=false;clearInterval(timerId);updateHeader();return;}timerRunning=true;lastTick=Date.now();timerId=setInterval(()=>{const now=Date.now(),diff=Math.floor((now-lastTick)/1000);if(diff>0){S.remaining=Math.max(0,S.remaining-diff);lastTick+=diff*1000;store();updateHeader();if(S.remaining===0){timerRunning=false;clearInterval(timerId)}}},1000);updateHeader()}
function go(screen){S.screen=screen;store();render();window.scrollTo({top:0,behavior:'instant'})}
function coreDone(i){S.coreCleared[i]=true;store();playSound();render();}
function award(i){if(S.completed[i])return;S.completed[i]=true;store();playSound(true);updateHeader();render();}
function awardBanner(i){return S.completed[i]?`<div class="reward-banner" role="status"><span class="gem-wrap lit"><span class="gem"></span></span><div><b>${i+1}-й кристалл получен!</b><br><span>${i===4?'Все пять кристаллов собраны. Можно запускать корабль!':'Испытание пройдено. Корабль становится ближе к спасению.'}</span></div></div>`:''}
function footer(active){let items=[['map','Карта'],...LEVELS.slice(0,3).map((x,i)=>['l'+i,String(i+1)+'. '+x.name]),['pause','Маяк'],...LEVELS.slice(3).map((x,i)=>['l'+(i+3),String(i+4)+'. '+x.name]),['final','Финал'],['report','Мой отчёт']];return `<nav class="nav-crumbs" aria-label="Переходы по уроку">${items.map(([id,txt])=>`<button class="crumb ${active===id?'current':''} ${id.startsWith('l')&&S.completed[Number(id.slice(1))]?'done':''}" data-go="${id}">${safe(txt)}</button>`).join('')}</nav><div class="fineprint">Автор: М. Братухина · интерактивный урок математики для 3 класса</div>`}
function mapScreen(){const pins=[{i:0,x:21,y:45,label:'Врата Таблицы'},{i:1,x:41,y:19,label:'Пещера Неизвестных'},{i:2,x:64,y:20,label:'Мост Порядка'},{i:3,x:80,y:47,label:'Лабиринт Задач'},{i:4,x:89,y:11,label:'Храм Геометрии'}];return `<div class="screen-title"><h1>Бухта Тревоги</h1><span class="tag">Вступление · 3 минуты</span></div>
<div class="student-field"><label for="studentName">Имя участника</label><input id="studentName" type="text" autocomplete="off" maxlength="40" placeholder="Например, Саша" value="${safe(S.studentName)}"><small>Имя появится в личном отчёте. Он сохранится только на этом устройстве.</small></div><section class="crew-select"><h3>Твоя роль в экипаже</h3><div class="assigned-role"><span class="assigned-role-icon">${ROLES[S.role].icon}</span><div><strong>${ROLES[S.role].name}</strong><small>${ROLES[S.role].desc}</small></div></div><p class="microcopy">Эту роль тебе уже назначил учитель. Выполняй общие испытания, затем своё особое поручение. После решения расскажи экипажу о своём способе в Zoom.</p></section>
<div class="hero-map" role="img" aria-label="Иллюстрированная карта острова с кораблём, воротами, пещерой, мостом, лабиринтом и храмом">
${pins.map(p=>`<button class="map-pin ${S.completed[p.i]?'complete':''}" data-go="l${p.i}" style="left:${p.x}%;top:${p.y}%" aria-label="${p.label}, ${S.completed[p.i]?'пройдено':'ещё не пройдено'}"><span class="mini">${lock(S.completed[p.i])} Испытание ${p.i+1}</span><small>${p.label}</small></button>`).join('')}
<div class="map-panel"><h2>Наш корабль попал в шторм!</h2><p>Бортовой компьютер заблокировался. Найдите <b>5 кристаллов знаний</b>, чтобы запустить двигатели. Готовы? Напишите <b>+</b> в чат!</p><button class="primary" data-go="${S.completed.every(Boolean)?'final':'l0'}">${S.completed.every(Boolean)?'Все кристаллы собраны — к финалу!':'Открыть Врата Таблицы'}</button></div>
</div>${footer('map')}`}
const ROLES=[
 {name:'Штурман',icon:'🧭',desc:'Проверяю маршрут и вычисления'},
 {name:'Механик',icon:'⚙',desc:'Чиню неисправные расчёты'},
 {name:'Исследователь',icon:'🔎',desc:'Ищу закономерности и проверяю'}
];
const CREW_CHALLENGES=[
 [
  {q:'Вычисли выражение: 7 × 9 − 8 × 6',a:15,work:'63 − 48 = 15.'},
  {q:'Вычисли выражение: 63 : 9 + 8 × 6',a:55,work:'7 + 48 = 55.'},
  {q:'Вычисли выражение: 8 × 8 − 54 : 9',a:58,work:'64 − 6 = 58.'}
 ],[
  {q:'Найди b: b × 8 = 56',a:7,work:'b = 56 : 8 = 7. Проверка: 7 × 8 = 56.'},
  {q:'Найди t: 72 : t = 9',a:8,work:'t = 72 : 9 = 8. Проверка: 72 : 8 = 9.'},
  {q:'Найди c: c : 7 = 8',a:56,work:'c = 8 × 7 = 56. Проверка: 56 : 7 = 8.'}
 ],[
  {q:'Вычисли: 72 : (9 − 1) + 6 × 3',a:27,work:'72 : 8 + 18 = 9 + 18 = 27.'},
  {q:'Вычисли: 60 − 7 × 6 + 12 : 3',a:22,work:'60 − 42 + 4 = 22.'},
  {q:'Вычисли: (63 − 21) : 7 × 4',a:24,work:'42 : 7 × 4 = 6 × 4 = 24.'}
 ],[
  {q:'А если больших жемчужин было 10, а остальные условия не изменились? Сколько цветных камушков?',a:44,work:'10 × 6 − 16 = 44 камушка.'},
  {q:'А если маленьких жемчужин 48, а цветных камушков на 24 меньше? Сколько камушков?',a:24,work:'48 − 24 = 24 камушка.'},
  {q:'Чтобы цветных камушков было в 3 раза больше, чем 8 больших жемчужин, на сколько меньше их должно быть, чем 48 маленьких?',a:24,work:'8 × 3 = 24 камушка; 48 − 24 = 24, значит на 24 меньше.'}
 ],[
  {q:'Длина прямоугольника 6 см, ширина 4 см. Длину увеличили на 2 см. На сколько сантиметров увеличился периметр?',a:4,work:'Было 20 см, стало (8 + 4) × 2 = 24 см, разница 4 см.'},
  {q:'Ширину прямоугольника 6 × 4 см увеличили на 2 см. На сколько см² увеличилась площадь?',a:12,work:'Стало 6 × 6 = 36 см²; 36 − 24 = 12 см².'},
  {q:'У прямоугольника периметр 20 см, длина 6 см. Сколько сантиметров составляет ширина?',a:4,work:'Полупериметр 10 см; 10 − 6 = 4 см.'}
 ]
];
const COUNCILS=[
 {q:'Почему одинаковый ответ 9 открыл три разные буквы?',answer:'Потому что буква привязана к номеру печати, а не к самому числу. Повторяющийся числовой ответ не мешает шифру.'},
 {q:'Как убедиться, что ты верно нашёл неизвестный делитель?',answer:'Подставить его: 64 : 8 = 8; или использовать связь: делитель = делимое : частное.'},
 {q:'На мосту кто-то написал: 70 − 56 : 8 × 7 = 14 : 8 × 7. Где ошибка?',answer:'Вычитание выполнили раньше деления и умножения. Правильно: 56 : 8 = 7, 7 × 7 = 49, 70 − 49 = 21.'},
 {q:'Почему «на 16 меньше» нельзя заменить словами «в 16 раз меньше»?',answer:'«На» означает вычитание 16: 48 − 16 = 32. «В» означает деление на 16: 48 : 16 = 3. Результаты разные.'},
 {q:'Может ли два прямоугольника иметь площадь 24 см², но разный периметр?',answer:'Да. У 6 × 4 см площадь 24 см² и периметр 20 см; у 8 × 3 см площадь 24 см², периметр 22 см.'}
];
function crewTaskSection(i){const me=ROLES[S.role]||ROLES[0],t=CREW_CHALLENGES[i][S.role]||CREW_CHALLENGES[i][0];return `<div class="crew-mission">
<h3>Личное поручение: ${me.icon} ${me.name}</h3>
${!S.coreCleared[i]?'<p class="crew-lock">Сначала выполни общее испытание. Личное поручение откроется затем.</p>':`<p>Реши своё задание <b>самостоятельно</b>, затем объясни решение другим членам экипажа в Zoom.</p><div class="crew-equation">${t.q}</div>${S.roleSolved[i]?`<div class="success-label">Ответ принят. ${t.work}</div>`:`<div class="path-row"><input class="step-input" id="crew-answer" inputmode="numeric" data-enter="crew:${i}" placeholder="Мой ответ" aria-label="Ответ на личное поручение"><button class="inline-action" data-check="crew:${i}">Проверить</button></div><div class="task-feedback" id="crew-msg" aria-live="polite"></div>${correctingBadge(`crew:${i}:role:${S.role}`)}`}`}
<div class="council"><h4>Совет экипажа — говорим по очереди</h4><p>${COUNCILS[i].q}</p><button class="secondary" data-debrief="${i}">${S.debriefShown[i]?'Скрыть объяснение':'Проверить обсуждение'}</button>${S.debriefShown[i]?`<div class="success-label">${COUNCILS[i].answer}</div>`:''}<p class="microcopy">Дождись сигнала учителя. Каждый может назвать свой ответ, но копии доски не синхронизируются.</p></div>
${S.completed[i]?'':`<button class="primary crew-award" data-award="${i}" ${!(S.coreCleared[i]&&S.roleSolved[i])?'disabled':''}>✦ Получить кристалл по сигналу учителя</button>`}
</div>`}
function stageShell(i,content){const L=LEVELS[i],next=(i===2?'pause':i===4?'final':'l'+(i+1));return `<div class="screen-title"><h1>${L.title}</h1><span class="tag">${L.minutes} минут · ${ROLES[S.role].name} · кристалл ${i+1}/5</span></div>
<div class="stage-grid"><section class="illustration ${L.art}" aria-label="Художественная иллюстрация локации"><div class="art-diamond"><span class="gem-wrap ${S.completed[i]?'lit':''}"><span class="gem"></span></span> ${S.completed[i]?'Кристалл найден':'Найди кристалл'}</div><div class="art-legend"><div class="eyebrow">Испытание ${i+1} из пяти</div><h2>${L.name}</h2><p>${L.goal}</p></div></section>
<section class="paper">${content}${crewTaskSection(i)}${awardBanner(i)}<div class="button-row"><button class="secondary" data-go="map">← На карту</button><button class="primary" data-go="${next}" ${!S.completed[i]?'disabled title="Появится после выполнения испытания"':''}>${i===4?'Запустить навигатор →':i===2?'Сигналы маяка →':'Следующая локация →'}</button></div></section></div>${footer('l'+i)}`}
const gates=[['7 × 8',56,'П'],['54 : 6',9,'О'],['8 × 9',72,'Б'],['63 : 7',9,'Е'],['6 × 7',42,'Д'],['81 : 9',9,'А']];
function gateScreen(){const tasks=gates.map(([eq,a,letter],i)=>`<div class="exercise ${S.gate[i]?'done':''}"><div class="eq">${i+1}. ${eq} =</div><input aria-label="Ответ примера ${i+1}" id="gate-${i}" inputmode="numeric" data-enter="gate:${i}" ${S.gate[i]?`value="${a}" disabled`:'placeholder="?"'}><div class="letter ${S.gate[i]?'revealed':''}">${S.gate[i]?letter:'✦'}</div>${!S.gate[i]?`<button class="inline-action" style="grid-column:1/-1;justify-self:end" data-check="gate:${i}">Открыть печать ${i+1}</button>`:''}<div class="small-feedback" id="gate-msg-${i}" aria-live="polite"></div>${correctingBadge(`gate:${i}`)}</div>`).join('');return stageShell(0,`<h3>Шифр старинного замка</h3><p class="lead">Решай примеры устно. Верный ответ открывает букву <b>именно на этой печати</b>. Собери слово из шести букв по порядку.</p><div class="row-list" style="display:grid;grid-template-columns:1fr 1fr">${tasks}</div><div class="cipher" aria-label="Открытые буквы шифра">${gates.map((g,i)=>`<span class="${S.gate[i]?'revealed':''}">${S.gate[i]?g[2]:'?'}</span>`).join('')}</div><div class="bonus-question"><b>Учитель спрашивает:</b> Как удобнее проверить деление с помощью умножения?</div>`)}
const caveData=[{eq:'x × 7 = 42',ans:6,rule:'mul',hint:'Как найти неизвестный множитель?'},{eq:'64 : y = 8',ans:8,rule:'divisor',hint:'Как найти неизвестный делитель?'},{eq:'a : 9 = 6',ans:54,rule:'dividend',hint:'Как найти неизвестное делимое?'}];
const rules=[['','Выбери правило'],['mul','Произведение разделить на известный множитель'],['divisor','Делимое разделить на частное'],['dividend','Частное умножить на делитель']];
function ruleSelect(id){return `<select id="${id}" aria-label="Правило нахождения неизвестного компонента">${rules.map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}</select>`}
function caveScreen(){return stageShell(1,`<h3>Почини древние таблички</h3><p class="lead">Камни закрыли неизвестные числа. Запиши решения в тетрадь, потом выбери правило и проверь себя.</p><div class="coach"><b>Произнеси правило вслух.</b> Почему здесь нужно делить, а здесь — умножать?</div>${caveData.map((t,i)=>`<div class="task-card ${S.cave[i]?'done':''}"><div class="task-top"><strong>${t.eq}</strong><span>Табличка ${i+1}/3</span></div><div class="task-controls"><div class="field"><label>Неизвестное число</label><input class="step-input" id="cave-${i}" inputmode="numeric" data-enter="cave:${i}" ${S.cave[i]?`value="${t.ans}" disabled`:'placeholder="Ответ"'}></div><div class="field"><label>${t.hint}</label>${S.cave[i]?`<div class="success-label" style="font-size:12px">${rules.find(r=>r[0]===t.rule)[1]}</div>`:ruleSelect('rule-'+i)}</div><button class="inline-action" data-check="cave:${i}" ${S.cave[i]?'disabled':''}>${S.cave[i]?'Верно!':'Проверить'}</button></div><div class="task-feedback" id="cave-msg-${i}" aria-live="polite"></div>${correctingBadge(`cave:${i}`)}${S.cave[i]?`<div class="success-label">${i===0?'x = 42 : 7 = 6':i===1?'y = 64 : 8 = 8':'a = 6 × 9 = 54'}</div>`:''}</div>`).join('')}<div class="bonus-question"><b>Проверка:</b> Подставь найденное число в равенство. Что получилось?</div>`)}
const bridgeData=[{eq:'48 : 6 + 2 × 9',answer:26,ord:'dmadd',hint:'Сначала деление и умножение, затем сложение.',work:'8 + 18 = 26'},{eq:'48 : (6 + 2) × 9',answer:54,ord:'brdm',hint:'Сначала скобки, затем деление и умножение слева направо.',work:'48 : 8 × 9 = 6 × 9 = 54'},{eq:'70 − 56 : 8 × 7',answer:21,ord:'dmsub',hint:'Сначала деление, потом умножение, затем вычитание.',work:'70 − 7 × 7 = 70 − 49 = 21'}];
const bridgeOrders=[['','Выбери правильный порядок'],['dmadd','1) :  2) ×  3) +'],['brdm','1) скобки  2) :  3) ×'],['dmsub','1) :  2) ×  3) −'],['addfirst','1) +  2) :  3) ×'],['subfirst','1) −  2) :  3) ×']];
function bridgeScreen(){return stageShell(2,`<h3>Хрупкие ступени</h3><p class="lead">Определи порядок действий и вычисли значение каждого выражения. Первые два сравни, третье реши <b>самостоятельно в тетради</b>.</p>${bridgeData.map((t,i)=>`<div class="task-card ${S.bridge[i]?'done':''}"><div class="task-top"><strong>${i+1}. ${t.eq} = ?</strong><span>${i===2?'Самостоятельно':'Обсуждаем вместе'}</span></div><div class="task-controls"><div class="field"><label>Ответ</label><input class="step-input" id="bridge-${i}" inputmode="numeric" data-enter="bridge:${i}" ${S.bridge[i]?`value="${t.answer}" disabled`:'placeholder="Число"'}></div><div class="field"><label>Порядок действий</label>${S.bridge[i]?`<div class="success-label" style="font-size:13px">${t.hint}</div>`:`<select id="order-${i}">${bridgeOrders.map(([v,txt])=>`<option value="${v}">${txt}</option>`).join('')}</select>`}</div><button class="inline-action" data-check="bridge:${i}" ${S.bridge[i]?'disabled':''}>${S.bridge[i]?'Верно!':'Проверить'}</button></div><div class="task-feedback" id="bridge-msg-${i}" aria-live="polite"></div>${correctingBadge(`bridge:${i}`)}${S.bridge[i]?`<div class="success-label">Решение: ${t.work}</div>`:''}</div>`).join('')}<div class="bonus-question"><b>Вопрос на понимание:</b> Почему у первых двух выражений разные ответы, хотя числа одинаковые?</div>`)}
const pauseData=[{eq:'6 × 4',a:24,even:true},{eq:'7 × 8',a:56,even:true},{eq:'9 × 7',a:63,even:false},{eq:'81 : 9',a:9,even:false}];
function pauseScreen(){let i=S.pauseIndex,t=pauseData[i]||pauseData[3];return `<div class="screen-title"><h1>Сигналы маяка</h1><span class="tag">Динамическая пауза · 2 минуты</span></div><div class="stage-grid"><section class="illustration art-pause"><div class="art-legend"><div class="eyebrow">Перерыв между испытаниями</div><h2>Маяк подаёт сигналы</h2><p>Чтобы увидеть свет маяка, надо ответить не словами, а движениями!</p></div></section><section class="paper"><h3>Проверяем чётность — двигаемся!</h3><div class="coach motion-note"><b>Чётный ответ</b> — хлопни в ладоши над головой.<br><b>Нечётный ответ</b> — присядь или закрой глаза ладонями.</div><div class="step-counter">${pauseData.map((x,j)=>`<i class="${j<=i?'on':''}"></i>`).join('')}</div><div class="pause-box"><div class="muted">Сигнал ${i+1} из 4</div><div class="pause-expression">${t.eq}</div><div class="pause-answer">${S.pauseRevealed?`${t.a} — ${t.even?'чётный: хлопаем!':'нечётный: приседаем!'}`:'Какой получится ответ?'}</div><div class="button-row" style="justify-content:center">${!S.pauseRevealed?'<button class="primary" data-act="pause-reveal">Показать ответ</button>':i<3?'<button class="primary" data-act="pause-next">Следующий сигнал →</button>':'<button class="primary" data-go="l3">К Лабиринту Задач →</button>'}</div></div><div class="bonus-question">Никаких кристаллов здесь нет: это короткая разминка перед задачей.</div><div class="button-row"><button class="secondary" data-go="map">← На карту</button><button class="secondary" data-act="pause-restart">Начать разминку заново</button></div></section></div>${footer('pause')}`}
const mazeSteps=[{q:'Во сколько всего маленьких жемчужин?',ans:48,expression:'8 × 6',comment:'8 × 6 = 48 (ж.) — маленьких жемчужин.'},{q:'Сколько цветных камушков?',ans:32,expression:'48 − 16',comment:'48 − 16 = 32 (к.) — цветных камушков.'},{q:'Во сколько раз камушков больше, чем больших жемчужин?',ans:4,expression:'32 : 8',comment:'32 : 8 = 4 (раза).'}];
function mazeScreen(){let stepIndex=S.maze.findIndex(v=>!v);return stageShell(3,`<h3>Выбери путь через лабиринт</h3><div class="problem">На берегу острова исследователи нашли <b>8 больших жемчужин</b>. Маленьких жемчужин было <b>в 6 раз больше</b>, чем больших. А цветных камушков — <b>на 16 меньше</b>, чем маленьких жемчужин.<br><b>Во сколько раз цветных камушков больше, чем больших жемчужин?</b></div><div class="coach">Сначала сделайте в тетради краткую запись или схему, затем объясните план решения. Введите ответы по шагам.</div><button class="secondary" data-act="scheme">${S.showScheme?'Скрыть опорную схему':'Показать опорную схему'}</button>${S.showScheme?`<div class="scheme"><b>8 больших</b><i>× 6 →</i><b>? маленьких</b><i>− 16 →</i><b>? камушков</b><i>: 8 →</i><b>? раз</b></div>`:''}<div style="margin-top:14px">${mazeSteps.map((t,i)=>{let locked=i>stepIndex&&stepIndex!==-1;return `<div class="path-step ${S.maze[i]?'done':''} ${locked?'locked':''}" data-n="${i+1}"><div class="question">${t.q}</div>${S.maze[i]?`<div class="success-label">${t.comment}</div>`:`<div class="path-row"><input class="step-input" id="maze-${i}" aria-label="Ответ на шаг ${i+1}" inputmode="numeric" placeholder="Ответ" data-enter="maze:${i}" ${locked?'disabled':''}><button class="inline-action" data-check="maze:${i}" ${locked?'disabled':''}>Проверить шаг</button></div>`}<div class="task-feedback" id="maze-msg-${i}" aria-live="polite"></div>${correctingBadge(`maze:${i}`)}</div>`}).join('')}</div><div class="bonus-question"><b>Главное правило:</b> Чтобы узнать, во сколько раз одно число больше другого, большее число делят на меньшее.</div>`)}
function rectSvg(show){return `<svg viewBox="0 0 470 300" role="img" aria-label="Схема прямоугольника со сторонами 6 сантиметров и 4 сантиметра"><defs><pattern id="squares" width="17" height="17" patternUnits="userSpaceOnUse"><path d="M17 0H0V17" fill="none" stroke="#e3e9e5" stroke-width="1"/></pattern></defs><rect x="54" y="48" width="355" height="218" fill="url(#squares)" stroke="#227e82" stroke-width="4"/><path d="M54 39v-10M409 39v-10M54 32H409M47 48H33M47 266H33M39 48V266" fill="none" stroke="#aa8e5b" stroke-width="2"/><text x="232" y="24" text-anchor="middle" font-size="20" fill="#785f36" font-weight="700">6 см</text><text x="18" y="164" text-anchor="middle" font-size="20" fill="#785f36" font-weight="700" transform="rotate(-90,18,164)">4 см</text>${show?'<text class="vertex" x="35" y="39">A</text><text class="vertex" x="414" y="39">B</text><text class="vertex" x="414" y="291">C</text><text class="vertex" x="35" y="291">D</text>':''}</svg>`}
function templeScreen(){return stageShell(4,`<h3>Чертёж посадочной площадки</h3><p class="lead">На листе в клетку с помощью линейки начерти прямоугольник <b>6 см × 4 см</b>. Обозначь его вершины по порядку <b>A, B, C, D</b>. Найди <b>периметр P</b> и <b>площадь S</b>.</p><div class="figure-box">${rectSvg(S.showVertices)}</div><button class="secondary" data-act="vertices">${S.showVertices?'Скрыть подписи вершин':'Проверить обозначения A, B, C, D'}</button><div class="bonus-question"><b>Обсуждаем:</b> Периметр — сумма длин всех сторон. Площадь — число квадратных сантиметров внутри фигуры.</div><div class="math-controls"><div class="field"><label>Периметр P (см)</label><input class="step-input" id="perimeter" inputmode="numeric" aria-label="Периметр в сантиметрах" placeholder="Ответ" ${S.temple?'value="20" disabled':''}></div><div class="field"><label>Площадь S (см²)</label><input class="step-input" id="area" inputmode="numeric" aria-label="Площадь в квадратных сантиметрах" placeholder="Ответ" ${S.temple?'value="24" disabled':''}></div><button class="inline-action" data-check="temple" ${S.temple?'disabled':''}>${S.temple?'Верно!':'Проверить'}</button></div><div class="task-feedback" id="temple-msg" aria-live="polite"></div>${correctingBadge(`temple:0`)}${S.temple?'<div class="success-label" style="margin-top:6px">P = (6 + 4) × 2 = 20 см; S = 6 × 4 = 24 см².</div>':''}<p class="muted">Рисунок на экране схематический. В тетради чертёж выполняется линейкой в настоящих сантиметрах.</p>`)}
function finalScreen(){let completed=S.completed.every(Boolean);return `<div class="screen-title"><h1>Запуск навигатора</h1><span class="tag">Финал и рефлексия · 3 минуты</span></div><div class="final-scene"><div class="final-gems">${gems(true)}</div><h2>${completed?'Путь домой открыт!':'Пока не хватает кристаллов'}</h2><p>${completed?'Бортовой компьютер запущен! Все пять испытаний пройдены, корабль выбирается из шторма. Экипаж, отличная работа!':`Получено ${S.completed.filter(Boolean).length} из 5 кристаллов. Возвращайся на карту и закончи оставшиеся испытания.`}</p><div class="button-row" style="justify-content:center"><button class="primary" data-go="map">${completed?'Посмотреть карту победы':'Вернуться к испытаниям'}</button></div></div><section class="reflection"><h3>Как прошло твоё путешествие?</h3><div class="reflection-options">${[[5,'Всё было легко, справился со всеми ловушками'],[4,'Было интересно, но пришлось задуматься'],[3,'Было сложно, нужно ещё потренироваться']].map(([n,txt])=>`<button class="rating ${S.rating===n?'active':''}" data-rate="${n}"><strong>${n}</strong><span>${txt}</span></button>`).join('')}</div><p id="ratingMsg">${S.rating?`Твоя оценка — ${S.rating}. Подумай: что у тебя сегодня получилось особенно хорошо?`:'Выбери число и напиши в чат, что было самым интересным или трудным.'}</p><p style="font-size:13px"><b>Домашняя ловушка по желанию:</b> придумай выражение в три действия или задачу про пиратов для одноклассников к следующему уроку.</p></section>${reportContent()}${footer('final')}`}
function reportStats(){const all=diagSummary(),days=new Date().toLocaleDateString('ru-RU');return {all,days,student:S.studentName.trim()||'Участник без имени',role:ROLES[S.role].name,rows:diagnosticEntries().sort((a,b)=>a.level-b.level)}}
function buildReportTable(report){const trs=report.rows.map(t=>`<tr><td>${safe(LEVELS[t.level].name)}<br><small>${safe(t.label)}</small></td><td>${t.errors||0}</td><td>${t.changes||0}</td><td>${t.corrected?'Да':t.solved?'Не требовалось':'Ещё не исправлено'}</td><td>${t.wrongSince===null?'—':secTime(correctTime(t))}</td></tr>`).join('');return `<div class="report-scroll"><table class="report-table"><thead><tr><th>Задание</th><th>Ошибки</th><th>Изменения ответа</th><th>Исправлено?</th><th>Время исправления</th></tr></thead><tbody>${trs||'<tr><td colspan="5">Пока нет проверенных ответов</td></tr>'}</tbody></table></div>`}
function reportContent(standalone=false){const r=reportStats(),x=r.all;return `<section class="report" id="personalReport"><h2>Личный журнал путешествия</h2><p class="report-intro"><b>${safe(r.student)}</b> · ${safe(r.role)} · ${r.days} · ${S.completed.filter(Boolean).length} из 5 кристаллов</p><div class="report-stats"><div class="report-stat"><strong>${x.errors}</strong><span>Неверных проверок</span></div><div class="report-stat"><strong>${x.changes}</strong><span>Изменений ответа</span></div><div class="report-stat"><strong>${x.corrected}</strong><span>Заданий с исправленными ошибками</span></div><div class="report-stat"><strong>${secTime(x.seconds)}</strong><span>Время на исправления</span></div></div><p class="report-status ${x.needsWork===0?'recovered':''}">${x.needsWork?`Есть задания с неисправленными ошибками: ${x.needsWork}.`:x.errors?'Все задания с ошибками исправлены!':'Пока неверных проверок нет.'}</p><h3>Какие задания пришлось исправлять?</h3>${buildReportTable(r)}<p class="report-footnote">Неверная проверка — отправленный неправильный ответ (пустой ответ не считается ошибкой). Изменение — другой вариант ответа при следующей проверке. Исправление — верный ответ после хотя бы одной неверной проверки. Таймер считает время от первой ошибки до верного ответа, пока страница открыта и активна. Ответы на бумаге и устные объяснения автоматически не учитываются. Отчёт хранится локально, другие ученики и учитель его не видят.</p>${!standalone?'<div class="report-actions"><button class="primary" data-act="download-report">⬇ Скачать личный отчёт</button><button class="secondary" data-act="print-report">Печать / PDF</button></div>':''}</section>`}
function reportScreen(){return `<div class="screen-title"><h1>Мой личный отчёт</h1><span class="tag">Результаты моей работы</span></div>${reportContent()}<div class="button-row"><button class="secondary" data-go="map">← На карту острова</button><button class="secondary" data-go="final">К финалу →</button></div>${footer('report')}`}
function printableReport(){const body=reportContent(true);return `<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Личный отчёт — ${safe(S.studentName||'Ученик')}</title><style>body{font:15px Arial,sans-serif;color:#173849;max-width:940px;margin:auto;padding:20px;background:white}.report{border:1px solid #9cbeb6;border-radius:14px;padding:23px}.report h2{font-size:26px;margin:0 0 9px}.report-intro{margin-bottom:15px}.report-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}.report-stat{border:1px solid #b2cac5;padding:15px 6px;text-align:center;border-radius:10px}.report-stat strong{display:block;font-size:28px;color:#087c87}.report-stat span{font-size:11px}.report-table{width:100%;border-collapse:collapse;font-size:12px}.report-table th,.report-table td{border:1px solid #cdded8;padding:8px;text-align:left}.report-table th{background:#e9f3f0}.report-table td:not(:first-child){text-align:center}.report-footnote{font-size:11px;color:#52676c;margin-top:18px;line-height:1.6}.report-status{font-weight:bold}.printbtn{margin-bottom:14px;padding:9px 18px;border-radius:8px;border:1px solid #777;background:#fff;cursor:pointer}@media print{.printbtn{display:none}body{padding:0}.report{border:0;padding:0}.report-stats{break-inside:avoid}}</style></head><body><button class="printbtn" onclick="window.print()">Распечатать или сохранить в PDF</button>${body}<p style="font-size:11px">Математика, 3 класс · «За кристаллами знаний» · автор М. Братухина.</p></body></html>`}
function downloadReport(){pauseCorrectionClocks();const data=printableReport();resumeCorrectionClocks();const blob=new Blob([data],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Отчёт_'+(S.studentName.trim()||'ученика').replace(/[^a-zа-яё0-9_-]/gi,'_').slice(0,38)+'.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function printReport(){pauseCorrectionClocks();const doc=printableReport();resumeCorrectionClocks();const win=window.open('','_blank');if(win){win.document.open();win.document.write(doc);win.document.close();win.focus();setTimeout(()=>win.print(),200);}else alert('Окно печати заблокировано. Используйте «Скачать личный отчёт» — его можно открыть и распечатать.')}
function render(){let html=S.screen==='map'?mapScreen():S.screen==='pause'?pauseScreen():S.screen==='final'?finalScreen():S.screen==='report'?reportScreen():/^l[0-4]$/.test(S.screen)?[gateScreen,caveScreen,bridgeScreen,mazeScreen,templeScreen][Number(S.screen.slice(1))]():mapScreen();document.getElementById('app').innerHTML=html;updateHeader()}
function numeric(val){const v=String(val??'').trim().replace(',','.');if(!v)return null;let n=Number(v);return Number.isFinite(n)?n:null}
function msg(id,feedback,good=false){const el=document.getElementById(id);if(el){el.textContent=feedback;el.classList.toggle('good',good);el.style.color=good?'#15765e':'#a33b37'}}
function check(type,id){
const i=Number(id);
if(type==='gate'){
 if(S.gate[i])return;
 const answer=numeric(document.getElementById('gate-'+i)?.value);
 if(answer===null){msg('gate-msg-'+i,'Сначала запиши ответ.');return}
 const correct=answer===gates[i][1];markAttempt('gate',i,String(answer),correct);
 if(correct){S.gate[i]=true;store();playSound();if(S.gate.every(Boolean))coreDone(0);else render()}
 else {msg('gate-msg-'+i,'Пока неверно. Пересчитай и попробуй снова.');showErrorClock('gate:'+i)}
}
if(type==='cave'){
 if(S.cave[i])return;
 const a=numeric(document.getElementById('cave-'+i)?.value),r=document.getElementById('rule-'+i)?.value,t=caveData[i];
 if(a===null||!r){msg('cave-msg-'+i,'Введи число и выбери правило.');return}
 const correct=a===t.ans&&r===t.rule;markAttempt('cave',i,`${a}|${r}`,correct);
 if(correct){S.cave[i]=true;store();playSound();if(S.cave.every(Boolean))coreDone(1);else render()}
 else{msg('cave-msg-'+i,a!==t.ans?'Проверь неизвестное число и равенство.':'Число верное! Теперь выбери подходящее правило.');showErrorClock('cave:'+i)}
}
if(type==='bridge'){
 if(S.bridge[i])return;
 const a=numeric(document.getElementById('bridge-'+i)?.value),r=document.getElementById('order-'+i)?.value,t=bridgeData[i];
 if(a===null||!r){msg('bridge-msg-'+i,'Введи ответ и выбери порядок действий.');return}
 const correct=a===t.answer&&r===t.ord;markAttempt('bridge',i,`${a}|${r}`,correct);
 if(correct){S.bridge[i]=true;store();playSound();if(S.bridge.every(Boolean))coreDone(2);else render()}
 else{msg('bridge-msg-'+i,a!==t.answer?'Проверь вычисления. С чего нужно начинать?':'Ответ верный! Уточни порядок действий.');showErrorClock('bridge:'+i)}
}
if(type==='maze'){
 if(S.maze[i]||i>0&&!S.maze[i-1])return;
 const a=numeric(document.getElementById('maze-'+i)?.value),t=mazeSteps[i];
 if(a===null){msg('maze-msg-'+i,'Запиши результат действия.');return}
 const correct=a===t.ans;markAttempt('maze',i,String(a),correct);
 if(correct){S.maze[i]=true;store();playSound();if(S.maze.every(Boolean))coreDone(3);else render()}
 else{msg('maze-msg-'+i,i===0?'Что означает «в 6 раз больше»?':i===1?'«На 16 меньше» — какое действие?':'Как выполняется кратное сравнение?');showErrorClock('maze:'+i)}
}
if(type==='temple'){
 if(S.temple)return;
 const p=numeric(document.getElementById('perimeter')?.value),a=numeric(document.getElementById('area')?.value);
 if(p===null||a===null){msg('temple-msg','Укажи и периметр, и площадь.');return}
 const correct=p===20&&a===24;markAttempt('temple',0,`${p}|${a}`,correct);
 if(correct){S.temple=true;store();coreDone(4)}
 else{msg('temple-msg',p!==20&&a!==24?'Проверь и периметр, и площадь.':p!==20?'Площадь верная! Периметр — сумма длин всех сторон.':'Периметр верный! Площадь измеряем в квадратных сантиметрах.');showErrorClock('temple:0')}
}
if(type==='crew'){
 if(S.roleSolved[i])return;
 const t=CREW_CHALLENGES[i][S.role],ans=numeric(document.getElementById('crew-answer')?.value);
 if(ans===null){msg('crew-msg','Введи свой ответ.');return}
 const correct=ans===t.a;markAttempt('crew',i,String(ans),correct);
 if(correct){S.roleSolved[i]=true;store();playSound();render()}
 else{msg('crew-msg','Проверь вычисления и порядок действий — у тебя получится.');showErrorClock(`crew:${i}:role:${S.role}`)}
}
}
function showErrorClock(key){const t=S.diagnostics.tasks[key];if(!t)return;let id=key.startsWith('crew')?'crew-msg':key.startsWith('temple')?'temple-msg':key.replace(':','-msg-');const msgel=document.getElementById(id);if(!msgel)return;let next=msgel.nextElementSibling;if(next?.classList.contains('correction-alert'))return;msgel.insertAdjacentHTML('afterend',correctingBadge(key));}


document.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;

if(btn.dataset.debrief!==undefined){const i=Number(btn.dataset.debrief);S.debriefShown[i]=!S.debriefShown[i];store();render();return}
if(btn.dataset.award!==undefined){const i=Number(btn.dataset.award);if(S.coreCleared[i]&&S.roleSolved[i])award(i);return}
if(btn.dataset.go){go(btn.dataset.go);return}if(btn.dataset.check){const [type,i]=btn.dataset.check.split(':');check(type,i);return}if(btn.dataset.rate){S.rating=Number(btn.dataset.rate);store();render();return}
switch(btn.dataset.act){case 'timer':startTimer();break;case 'sound':S.sound=!S.sound;store();updateHeader();if(S.sound)playSound();break;case 'fullscreen':if(!document.fullscreenElement){document.documentElement.requestFullscreen?.().catch(()=>{})}else document.exitFullscreen?.();break;case 'download-report':downloadReport();break;case 'print-report':printReport();break;case 'reset':if(confirm('Начать путешествие заново? Все кристаллы, ответы, таймер и журнал ошибок обнулятся.')){if(timerRunning)startTimer();S=initial();store();go('map')}break;case 'scheme':S.showScheme=!S.showScheme;store();render();break;case 'vertices':S.showVertices=!S.showVertices;store();render();break;case 'pause-reveal':S.pauseRevealed=true;store();playSound();render();break;case 'pause-next':S.pauseIndex=Math.min(3,S.pauseIndex+1);S.pauseRevealed=false;store();render();break;case 'pause-restart':S.pauseIndex=0;S.pauseRevealed=false;store();render();break;}}
);
document.addEventListener('input',e=>{if(e.target.id==='studentName'){S.studentName=e.target.value.slice(0,40);store()}});document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseCorrectionClocks();else resumeCorrectionClocks()});window.addEventListener('pagehide',pauseCorrectionClocks);document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('input[data-enter]')){e.preventDefault();let [kind,i]=e.target.dataset.enter.split(':');check(kind,i)}});
render();resumeCorrectionClocks();diagnosticInterval=setInterval(refreshDiagCounters,1000);
</script>
</body>
</html>
