function heading(title,description,index){return `<div class="stageheader"><img alt="Художественная иллюстрация математической лаборатории" src="${art[index]}"><div><div class="eyebrow">Математическая лаборатория</div><h1 class="title">${title}</h1><p class="lead">${description}</p></div></div>`}
function action(label,handler='nextStep()',className='primary'){return `<button type="button" class="${className}" onclick="${handler}">${label}</button>`}
function optionOrder(key,opts){if(!choiceCache[key])choiceCache[key]=shuffle(opts);return choiceCache[key]}
function choices(key,opts){return optionOrder(key,opts).map(o=>`<button type="button" class="choice ${formSelection===o?'active':''}" onclick="pickChoice(this.dataset.value)" data-value="${clean(o)}">${clean(o)}</button>`).join('')}
function pickChoice(v){formSelection=v;document.querySelectorAll('.choice').forEach(b=>b.classList.toggle('active',b.textContent===String(v)))}
function questionField(question,key){if(question.kind==='choice')return choices(key,question.opts);

return `<div class="inputrow"><input id="typed" class="answerfield" type="text" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="Введи ответ" placeholder="?"/><span class="tiny">Впиши число сам</span></div>`;}
function getAnswer(){const inp=el('typed');return inp?inp.value.trim():formSelection;}
function checkValue(answer,expected,key,section,hint,next){if(!answer){feedback('Сначала выбери или впиши ответ.');return}

let canvasDrawing=false,ctx=null,lastPoint=null;
function initCanvas(){const canvas=el('pencil');if(!canvas)return;const bounds=canvas.getBoundingClientRect();canvas.width=Math.max(1,Math.floor(bounds.width*devicePixelRatio));canvas.height=Math.max(1,Math.floor(bounds.height*devicePixelRatio));ctx=canvas.getContext('2d');ctx.scale(devicePixelRatio,devicePixelRatio);ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=4;ctx.strokeStyle=state.ink;
function pos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);canvasDrawing=true;ctx.strokeStyle=state.ink;ctx.beginPath();const p=pos(e);ctx.moveTo(p.x,p.y);lastPoint=p;});
canvas.addEventListener('pointermove',e=>{if(!canvasDrawing)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();lastPoint=p;});
canvas.addEventListener('pointerup',()=>{canvasDrawing=false;lastPoint=null});canvas.addEventListener('pointercancel',()=>{canvasDrawing=false;lastPoint=null});}
function setInk(c){state.ink=c;save();document.querySelectorAll('.pen').forEach(p=>p.classList.remove('active'));const pens=document.querySelectorAll('.pen');const m={'#1f6ed6':0,'#d74b44':1,'#248962':2};if(pens[m[c]])pens[m[c]].classList.add('active')}
function clearInk(){const canvas=el('pencil');if(ctx&&canvas)ctx.clearRect(0,0,canvas.width,canvas.height)}
function render(){topRoute();if(state.phase===-1)intro();else if(state.phase===0)warmView();else if(state.phase===1)notebook1();else if(state.phase===2)machineView();else if(state.phase===3)notebook2();else if(state.phase===4||state.phase===5)detective();}
function restartLesson(){state=defaults();choiceCache={};formSelection=null;save();render();window.scrollTo(0,0)}
el('restart').addEventListener('click',()=>{if(confirm('Начать лабораторию заново? Текущий прогресс этого урока будет сброшен.'))restartLesson()});
render();
