const text='Под старой яблоней сидела маленькая синица. Птичка нахохлилась. Вокруг неё лежал снег.';
const words=['забор','синица','снег','крылья','яблоня','ягоды','нахохлилась'];const keys=['синица','яблоня','снег','нахохлилась'];
const titles=['Старая яблоня','Красивый снег','Синица в зимнем саду'];
let step=0,selected=new Set(),title=-1,checked=false,compare=false,audioURL='';const app=document.querySelector('#app');
document.body.style.backgroundImage=`linear-gradient(#34271d77,#34271d77),url('${ART.office}')`;
function btn(label,action,cls=''){return `<button class="${cls}" onclick="${action}">${label}</button>`}
function pic(){return `<img class="scene" src="${ART.bird}" alt="Синица на снегу под старой яблоней в зимнем саду">`}
function feedback(s,good){const f=document.getElementById('feedback');f.textContent=s;f.className='feedback '+(good?'good':'bad')}
function render(){document.querySelector('#progress').textContent=step<3?`Задание ${step+1} из 3 · 3 класс`:'Разминка завершена';
if(step===0){app.innerHTML=`<section class="paper"><div class="layout"><div>${pic()}<p class="hint">Рассмотрите иллюстрацию вместе.</p></div><div><div class="eyebrow">От главного к подробностям</div><h1>1. Найдите важные слова</h1><p>Ответьте на вопросы вслух по очереди. Дополняйте ответы друг друга.</p><ol class="questions"><li>Кто изображён на картинке?</li><li>Где находится синица?</li><li>Что можно сказать о её состоянии?</li></ol><p>А теперь выберите четыре слова, которые помогут рассказать о самом главном: о птице, её месте и состоянии.</p><div class="wordbank">${words.map((w,i)=>`<button class="choice" aria-pressed="false" onclick="pick(${i},this)">${w}</button>`).join('')}</div><div class="actions">${btn('Проверить','checkWords()','primary')}<button class="primary hidden" id="next" onclick="go(1)">Дальше</button></div><div id="feedback" class="feedback" aria-live="polite"></div><details><summary>Аудиозапись учителя (необязательно)</summary><p>Выберите аудиофайл на компьютере или откройте запись instruction.mp3, если она размещена рядом с HTML.</p><input type="file" accept="audio/*" onchange="attach(this)"><div class="actions">${btn('Открыть общую запись','shared()')}</div><audio controls id="audio" ${audioURL?'src="'+audioURL+'"':''}></audio><p class="hint" id="audioStatus"></p></details></div></div></section>`;return}
if(step===1){app.innerHTML=`<section class="paper"><div class="layout"><div>${pic()}</div><div><div class="eyebrow">Одна мысль — один заголовок</div><h2>2. Озаглавьте текст</h2><p>Прочитайте текст. Обсудите, о ком или о чём в нём говорится.</p><div class="passage">${text}</div><p>Выберите заголовок, который отражает содержание всего текста. Объясните свой выбор вслух.</p><div class="choices">${titles.map((t,i)=>`<button class="choice" aria-pressed="false" onclick="pickTitle(${i},this)">${t}</button>`).join('')}</div><div class="actions">${btn('Проверить','checkTitle()','primary')}<button class="primary hidden" id="next" onclick="go(2)">Дальше</button></div><div class="feedback" id="feedback" aria-live="polite"></div></div></div></section>`;return}
if(step===2){app.innerHTML=`<section class="paper final"><div class="eyebrow">Восстанавливаем содержание</div><h2>3. Перескажите текст</h2><p>Текст и картинка закрыты. Остались только заголовок и опорные слова.</p><div class="passage"><b>Синица в зимнем саду</b><p class="keyline">Синица · яблоня · снег · нахохлилась</p></div><p>По очереди перескажите текст своими словами. Пока один рассказывает, второй слушает и проверяет, все ли важные детали переданы. Затем поменяйтесь.</p><p class="hint">Не нужно повторять предложения слово в слово. Важно сохранить смысл.</p><div class="actions">${btn('Мы пересказали. Сравнить с текстом','showText()','primary')}</div><div id="original" class="hidden"><div class="passage">${text}</div><p>Все ли важные сведения сохранились? Если что-то пропустили, дополните рассказ устно.</p>${btn('Завершить разминку','go(3)','primary')}</div></section>`;return}
app.innerHTML=`<section class="paper final"><div class="eyebrow">Переходим к изложению</div><h2>Теперь работаем самостоятельно</h2><p>Вы потренировались выделять важное, озаглавливать и пересказывать текст. Используйте тот же способ при работе с новым текстом на доске.</p><ol class="algorithm"><li>Прочитай текст.</li><li>Определи, о чём он.</li><li>Раздели текст на смысловые части.</li><li>Найди ключевые слова каждой части.</li><li>Озаглавь каждую часть — составь план.</li><li>Перескажи текст по плану.</li><li>Запиши изложение.</li><li>Проверь написанное.</li></ol><div class="finish"><b>Закрой игру и приготовь тетрадь.</b></div></section>`;}
function invalidate(){checked=false;document.querySelectorAll('.choice').forEach(b=>b.classList.remove('good','bad'));document.getElementById('next').classList.add('hidden');document.getElementById('feedback').textContent=''}
function pick(i,b){invalidate();let w=words[i];if(selected.has(w))selected.delete(w);else selected.add(w);b.setAttribute('aria-pressed',String(selected.has(w)))}
function checkWords(){if(selected.size!==4){feedback('Выберите ровно четыре слова.',false);return}let ok=keys.every(w=>selected.has(w));document.querySelectorAll('.choice').forEach((b,i)=>{b.classList.remove('good','bad');if(selected.has(words[i]))b.classList.add(keys.includes(words[i])?'good':'bad')});checked=ok;feedback(ok?'Верно! Эти слова помогают передать главное.':'Среди выбранных слов есть лишние. Обсудите, какие детали важнее.',ok);document.getElementById('next').classList.toggle('hidden',!ok)}
function pickTitle(i,b){invalidate();title=i;document.querySelectorAll('.choice').forEach((x,j)=>x.setAttribute('aria-pressed',String(i===j)))}
function checkTitle(){if(title<0){feedback('Сначала выберите заголовок.',false);return}let ok=title===2;checked=ok;document.querySelectorAll('.choice')[title].classList.add(ok?'good':'bad');feedback(ok?'Верно! Заголовок сообщает, о ком текст и где происходит действие.':'Этот заголовок отражает только одну деталь. Найдите заголовок для всего текста.',ok);document.getElementById('next').classList.toggle('hidden',!ok)}
function go(n){if(n===1||n===2){if(!checked)return}if(n===3&&!compare)return;step=n;checked=false;render();window.scrollTo(0,0)}
function showText(){compare=true;document.getElementById('original').classList.remove('hidden');document.getElementById('original').scrollIntoView({block:'nearest',behavior:'smooth'})}
function attach(el){if(!el.files[0])return;if(audioURL.startsWith('blob:'))URL.revokeObjectURL(audioURL);audioURL=URL.createObjectURL(el.files[0]);document.getElementById('audio').src=audioURL;document.getElementById('audioStatus').textContent='Запись подключена на этом устройстве.'}
function shared(){const a=document.getElementById('audio');a.src='instruction.mp3';audioURL='instruction.mp3';a.onerror=()=>{document.getElementById('audioStatus').textContent='Запись не найдена. Учитель может прочитать инструкцию вслух.'};a.play().catch(()=>{})}
document.getElementById('restart').onclick=()=>{step=0;selected.clear();title=-1;checked=false;compare=false;render();window.scrollTo(0,0)};render();
</script></body></html>
